<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card de Personagem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
  <section class="card">
    <img src="housemd.jpeg" alt="Imagem do personagem">
    <h1>House, M.D.</h1>
    <p class="descricao">Um médico exímio do Princeton-Plainsboro Teaching Hospital, conhecido por sua desobediência e vício em Vicodin.</p>
    <div class="habilidades">
      <h2>Habilidades</h2>
      <ul>
        <li>Diagnóstico excepcional</li>
        <li>Raciocínio lógico e analítico</li>
        <li>Conhecimento médico profundo</li>
      </ul>
    </div>
    <div class="caracteristicas">
      <h2>Características</h2>
      <p><strong>Classe:</strong> Médico</p>
      <p><strong>Nível:</strong> 45</p>
      <p><strong>Elemento:</strong> Opióide</p>
    </div>
  </section>
</main>
</body>
</html>
